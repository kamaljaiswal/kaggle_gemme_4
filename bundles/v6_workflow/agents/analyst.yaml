name: analyst_v26
description: Finds the cause of the issue and writes the plan for the fixer.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include analyst.md
output_key: plan
tools:
  - agent_tool:
      config_path: agents/explorer.yaml
  - run_command
  - get_status
generate_content_config:
  temperature: 0.2
  top_p: 0.95
  top_k: 64
  thinking_config:
    include_thoughts: true
    thinking_budget: 2048
  max_output_tokens: 4096
