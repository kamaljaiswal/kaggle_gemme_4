name: explorer_v26
description: >-
  Investigates the repository and answers one question with file paths, line numbers and short code excerpts.
  Its searches do not use the caller's context. Put everything it needs in the request: the relevant part of the
  problem statement and the precise question.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include explorer.md
tools:
  - run_command
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
generate_content_config:
  temperature: 0.2
  top_p: 0.95
  top_k: 64
  thinking_config:
    include_thoughts: false
    thinking_budget: 0
  max_output_tokens: 2048
